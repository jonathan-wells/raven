[project]
name = "raven"
version = "0.1.0"
description = "Raven pulls SEC filings and facilitates data vizualisation."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dbt>=1.0.0.40.18",
    "dbt-core>=1.11.12",
    "dbt-duckdb>=1.10.1",
    "duckdb>=1.5.4",
    "prefect>=3.7.7",
    "prefect-dbt>=0.7.25",
    "streamlit>=1.60.0",
]

[dependency-groups]
dev = [
    "marimo>=0.23.16",
    "numpy>=2.5.1",
    "pandas>=3.0.3",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "ruff>=0.15.20",
    "seaborn>=0.13.2",
]
