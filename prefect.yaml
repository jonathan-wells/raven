---
name: raven
prefect-version: 3.7.7

pull:
  - prefect.deployments.steps.set_working_directory:
      directory: /home/raven

deployments:
  - name: load-edgar-data
    entrypoint: ./orchestration/flows.py:load_edgar_data
    description: Calls the EDGAR API and populates the Raven DuckDB with data.
    work_pool:
      name: raven-pool
    schedules:
      - cron: "00 22 * * 4"
        timezone: America/New_York
        active: true

  - name: run-dbt
    entrypoint: ./orchestration/flows.py:run_dbt
    description: Runs dbt to build clean and presentation layer models.
    work_pool:
      name: raven-pool
    schedules:
      - cron: "15 22 * * 1-7"
        timezone: America/New_York
        active: true
